<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topbar</title>
</head>

<body>

  <!-- TOPBAR CONTAINER -->
  <div>

    <!-- LEFT: LOGO -->
    <div>
      Trackr
    </div>

    <!-- CENTER: SEARCH BAR -->
    <div>
      <input type="text" placeholder="Search courses, assignments...">
    </div>

    <!-- RIGHT: REMINDER -->
    <div>

      <!-- BELL ICON -->
      <span>🔔</span>

      <!-- REMINDER CONTENT (always visible in pure HTML) -->
      <div>

        <p><strong>Reminders</strong></p>

        <p>Assignment 3 due tomorrow</p>
        <p>Quiz on Friday</p>

      </div>

    </div>

  </div>

</body>
</html>
