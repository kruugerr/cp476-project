<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Syllabus · Trackr</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      try {
        var saved = localStorage.getItem("trackr-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefersDark ? "dark" : "light"),
        );
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/app-pages.css" />
  </head>

  <body class="app" data-page="upload">
    <div data-include="../partials/student-sidebar.html"></div>

    <div class="app-main">
      <div data-include="../partials/topbar.html"></div>

      <main class="app-content">
        <div class="page">
          <h1>Add a new course</h1>
          <p class="subtext">
            Upload your syllabus PDF and our AI will extract all the important
            details for you
          </p>

          <div class="steps">
            <span class="active-step">1 Upload PDF</span>
            <span>2 Course details</span>
            <span>3 AI extraction</span>
            <span>4 Review &amp; confirm</span>
          </div>
          <div class="upload-box">
            <div class="upload-icon">
              <svg
                width="26"
                height="26"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 16V4M7 9l5-5 5 5" />
                <path d="M20 16v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3" />
              </svg>
            </div>
            <h3>Drop your syllabus here</h3>
            <p>Drag and drop your PDF or click to browse.</p>
            <p>One syllabus per course upload.</p>
            <label class="browse-btn">
              Browse files
              <input type="file" id="pdfFile" accept="application/pdf" />
            </label>

            <small>PDF only · Max 20 MB</small>
            <p id="fileMessage"></p>
          </div>

          <div class="bottom-buttons">
            <a href="dashboard.html" class="cancel-btn">Cancel</a>
            <button id="extractBtn">Extract with AI</button>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/include.js"></script>
    <script src="../js/upload-syllabus.js"></script>
  </body>
</html>
