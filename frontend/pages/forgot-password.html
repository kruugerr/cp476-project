<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Trackr</title>
    <script>
        try {document.documentElement.dataset.theme = localStorage.getItem("tracker-theme")|| "light"; }
        catch(e) {document.documentElement.dataset.theme = "light";}
    </script>

    <link rel=""preconnect href="https://fonts.googleapis.com"/> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/styles.css" />

</head>

<body>
    <main class="auth">

        <a class="auth-brand" href="../index.html" aria-label="Trackr home">
            <img src="../assets/logo.png" alt="Trackr logo"/>
            <span class="brand-name">Trackr</span>
        </a>


        <section class="auth-card">

            <img src="../assets/forgot-password.png"
                alt="User resetting password illustration"
                class="reset-illustration" />

            <!-- title -->
            <h1 class="auth-title">Reset your password</h1>

            <!-- instruction text -->
            <p class="auth-text">
            Enter your email address and we’ll send you a link to reset your password.
            </p>

            <!-- form -->
            <form class="auth-form">

            <div class="field">
                <label class="field-label" for="email">Email</label>
                <input class="input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="user@university.ca"
                    required />
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Send reset link
            </button>

            </form>

            <!-- cancel -->
            <p class="auth-footer">
            <a href="login.html" class="link">Cancel</a>
            </p>

        </section>

    </main>

</body>
