<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignments · Trackr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        var saved = localStorage.getItem("trackr-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefersDark ? "dark" : "light"),
        );
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/app-pages.css" />
  </head>
  <body class="app" data-page="assignments">
    <div data-include="../partials/student-sidebar.html"></div>

    <div class="app-main">
      <div data-include="../partials/topbar.html"></div>

      <main class="app-content">
        <div class="page">
          <p class="page-eyebrow">Assignments</p>
          <h1>All Assignments</h1>
          <p class="subtext">8 total · 1 overdue</p>

          <div class="filters">
            <input
              type="text"
              placeholder="Search assignments…"
              style="flex: 1; min-width: 180px"
            />
            <select>
              <option>All Courses</option>
              <option>CS301</option>
              <option>MATH201</option>
            </select>
            <select>
              <option>All Status</option>
              <option>Not Started</option>
              <option>In Progress</option>
              <option>Graded</option>
            </select>
            <button class="btn">+ Add assignment</button>
          </div>

          <div class="tabs" id="sortTabs">
            <button class="is-active" data-sort="due">Due date</button>
            <button data-sort="priority">Priority</button>
            <button data-sort="weight">Weight</button>
          </div>

          <div id="assignmentList"></div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/include.js"></script>
    <script type="module" src="../js/assignment-view.js"></script>
  </body>
</html>
